<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>BizBoost · Command Centre</title>
<meta name="viewport" content="width=1440" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />

<style>
  /* ============ DESIGN SYSTEM ============ */
  :root {
    /* surfaces */
    --bg: #0A0B0A;
    --bg-1: #101210;
    --bg-2: #161916;
    --bg-3: #1F231F;
    --bg-hover: #1E211C;
    --bg-active: #262A22;
    --panel: #14171494;
    --elev: #1A1E1A;
    --line: #232723;
    --line-2: #2C312C;
    --line-soft: #1d211d;

    /* text */
    --ink: #F1F3EE;
    --ink-2: #D4D7CE;
    --mute: #8E938A;
    --mute-2: #5F635C;
    --dim: #3A3D38;

    /* brand */
    --lime: #CFFF3A;
    --lime-soft: #CFFF3A33;
    --lime-glow: 0 0 40px #cfff3a30;
    --teal: #4FE3C1;
    --amber: #FFB547;
    --red: #FF6B5C;
    --violet: #8B7CFF;
    --blue: #5BCEFA;

    /* type */
    --serif: 'Instrument Serif', 'Times New Roman', serif;
    --sans: 'Geist', -apple-system, system-ui, sans-serif;
    --mono: 'Geist Mono', ui-monospace, monospace;

    /* radii */
    --r-xs: 6px;
    --r-sm: 10px;
    --r-md: 14px;
    --r-lg: 20px;
    --r-xl: 28px;

    /* density */
    --row-h: 44px;
    --pad-x: 22px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  body {
    font-size: 14px;
    line-height: 1.45;
    overflow: hidden;
    background:
      radial-gradient(1200px 800px at 80% -20%, #1a2014 0%, transparent 60%),
      radial-gradient(900px 600px at -10% 110%, #0f1410 0%, transparent 55%),
      var(--bg);
  }
  ::selection { background: var(--lime); color: #0a0a0a; }

  /* scrollbars */
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-thumb { background: #2a2e2a; border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
  *::-webkit-scrollbar-thumb:hover { background: #393e39; background-clip: padding-box; border: 2px solid transparent; }
  *::-webkit-scrollbar-track { background: transparent; }

  /* layout */
  #app { display: grid; grid-template-columns: 252px 1fr; height: 100vh; width: 100vw; }
  .with-ai #app { grid-template-columns: 252px 1fr 340px; }
  .sidebar-collapsed #app { grid-template-columns: 60px 1fr; }
  .sidebar-collapsed.with-ai #app { grid-template-columns: 60px 1fr 340px; }

  /* ===== type ===== */
  .h-display {
    font-family: var(--serif);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 0.95;
  }
  .h-display .it { font-style: italic; color: var(--lime); }
  .h-display .outline {
    -webkit-text-stroke: 1.2px var(--ink);
    color: transparent;
  }
  .eyebrow {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--mute);
    font-weight: 500;
  }
  .num {
    font-family: var(--sans);
    font-feature-settings: "tnum", "ss01";
    letter-spacing: -0.02em;
  }
  .mono { font-family: var(--mono); font-size: 12px; letter-spacing: -0.01em; }

  /* ===== buttons / chips ===== */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    height: 32px; padding: 0 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg-2);
    color: var(--ink);
    font: 500 12.5px var(--sans);
    cursor: pointer;
    transition: all .15s ease;
  }
  .btn:hover { border-color: var(--line-2); background: var(--elev); }
  .btn-primary {
    background: var(--lime);
    color: #0a0a0a;
    border-color: var(--lime);
    font-weight: 600;
  }
  .btn-primary:hover { background: #d9ff5e; }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--mute); }
  .btn-ghost:hover { color: var(--ink); background: var(--bg-2); }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    height: 22px; padding: 0 8px;
    border-radius: 999px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    color: var(--ink-2);
    font: 500 11px var(--sans);
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  .chip-lime { background: #c8f93824; color: var(--lime); border-color: #cfff3a44; }
  .chip-teal { background: #4fe3c124; color: var(--teal); border-color: #4fe3c144; }
  .chip-amber { background: #ffb54724; color: var(--amber); border-color: #ffb54744; }
  .chip-red { background: #ff6b5c24; color: var(--red); border-color: #ff6b5c44; }
  .chip-violet { background: #8b7cff24; color: var(--violet); border-color: #8b7cff44; }
  .chip-dim { color: var(--mute); }

  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: inline-block; }

  .mv-btn { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg-1); color: var(--mute); cursor: pointer; display: grid; place-items: center; }
  .mv-btn:hover { background: var(--bg-active); color: var(--ink); border-color: var(--line-2); }
  .task-card:hover { border-color: var(--line-2); }

  /* ===== cards / panels ===== */
  .panel {
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
  }
  .panel-elev { background: var(--bg-2); }
  .panel-bare { background: transparent; border: 1px solid var(--line); border-radius: var(--r-md); }

  .divider { height: 1px; background: var(--line); width: 100%; }

  /* delta tag */
  .delta { font: 500 11px var(--mono); padding: 2px 6px; border-radius: 6px; }
  .delta-up { color: var(--lime); background: #cfff3a14; }
  .delta-dn { color: var(--red); background: #ff6b5c14; }
  .delta-flat { color: var(--mute); background: #ffffff08; }

  /* avatars */
  .avatar {
    width: 28px; height: 28px;
    border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    font: 600 12px var(--sans); color: #0a0a0a;
    background: var(--lime);
    flex-shrink: 0;
  }
  .avatar-sm { width: 20px; height: 20px; border-radius: 6px; font-size: 10px; }
  .avatar-lg { width: 40px; height: 40px; border-radius: 10px; font-size: 16px; }

  /* progress */
  .prog {
    height: 4px; border-radius: 999px; background: var(--line);
    overflow: hidden;
  }
  .prog > i { display: block; height: 100%; background: var(--lime); border-radius: inherit; }

  /* keyboard hint */
  .kbd {
    display: inline-flex; align-items: center; justify-content: center;
    height: 18px; min-width: 18px; padding: 0 4px;
    border-radius: 4px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    color: var(--mute);
    font: 500 10.5px var(--mono);
  }

  /* sparkline strokes match palette */
  .spark path { fill: none; stroke: var(--lime); stroke-width: 1.5; }
  .spark .area { fill: url(#sparkGrad); stroke: none; }

  /* ===== animations ===== */
  @keyframes pulse-dot { 0%, 100% { box-shadow: 0 0 0 0 currentColor; } 50% { box-shadow: 0 0 0 6px transparent; } }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); display: inline-block; box-shadow: 0 0 0 0 var(--lime); animation: pulse 2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 #cfff3a88; }
    70% { box-shadow: 0 0 0 7px #cfff3a00; }
    100% { box-shadow: 0 0 0 0 #cfff3a00; }
  }

  @keyframes fadeup {
    from { transform: translateY(8px); }
    to { transform: none; }
  }
  .fadeup { animation: fadeup .4s ease; }

  @keyframes slideInR {
    from { transform: translateX(40px); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
  .slide-in-r { animation: slideInR .28s cubic-bezier(.22,.61,.36,1); }

  .kr-row { transition: border-color .15s, background .15s; }
  .kr-row:hover { border-color: var(--line-3) !important; background: var(--bg-3) !important; }
  .kr-range { -webkit-appearance: none; appearance: none; height: 5px; border-radius: 99px; background: var(--bg-3); outline: none; }
  .kr-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 99px; background: var(--lime); cursor: pointer; border: 2px solid var(--bg-1); }
  .kr-range::-moz-range-thumb { width: 14px; height: 14px; border-radius: 99px; background: var(--lime); cursor: pointer; border: 2px solid var(--bg-1); }

  /* Automations */
  .auto-card:hover { border-color: var(--line-3) !important; transform: translateY(-2px); }
  .auto-step { transition: border-color .2s, background .2s; }
  .auto-step:hover { border-color: var(--line-3) !important; background: var(--bg-3) !important; }
  .auto-detail-step { transition: border-color .15s; }
  .auto-detail-step:hover { border-color: var(--line-3) !important; }
  .flow-pulse { position: absolute; top: 50%; left: 0; width: 6px; height: 6px; border-radius: 99px; background: var(--lime); box-shadow: 0 0 8px var(--lime); transform: translateY(-50%); animation: flowMove 2.4s ease-in-out infinite; }
  @keyframes flowMove { 0% { left: 0; opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { left: 100%; opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .flow-pulse { display: none; } }
  .opt-scan { opacity: 0; animation: optScanIn .4s ease forwards; }
  @keyframes optScanIn { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
  .opt-rec { animation: optRecIn .35s ease both; }
  @keyframes optRecIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ===== utility ===== */
  .row { display: flex; align-items: center; }
  .col { display: flex; flex-direction: column; }
  .gap-2 { gap: 8px; }
  .gap-3 { gap: 12px; }
  .gap-4 { gap: 16px; }
  .gap-5 { gap: 20px; }
  .between { justify-content: space-between; }
  .stretch { align-items: stretch; }
  .flex-1 { flex: 1; }

  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* focus */
  :focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; border-radius: 6px; }

  /* hide when collapsed */
  .sidebar-collapsed .sb-text { display: none !important; }
  .sidebar-collapsed .sb-section-label { display: none !important; }
  .sidebar-collapsed .sb-toggle { display: none !important; }
  .sidebar-collapsed .sb-trail { display: none !important; }
  .sidebar-collapsed .sb-row { justify-content: center !important; padding-left: 0 !important; padding-right: 0 !important; }
  .sidebar-collapsed .sb-quickadd { padding: 8px !important; }
  .sidebar-collapsed .sb-quickadd-label { display: none !important; }
  .sidebar-collapsed .sb-workspace { padding: 8px !important; }
  .sidebar-collapsed .sb-workspace-meta { display: none !important; }
  .sb-acct:hover { background: var(--bg-2); }
  .acct-menu { position: absolute; bottom: 60px; left: 12px; right: 12px; z-index: 61; background: var(--elev); border: 1px solid var(--line-2); border-radius: 14px; box-shadow: 0 18px 60px #000b; padding: 6px; }
  .acct-head { display: flex; gap: 9px; align-items: center; padding: 9px 9px 10px; border-bottom: 1px solid var(--line); margin-bottom: 5px; }
  .acct-sec { display: flex; flex-direction: column; gap: 1px; }
  .acct-div { height: 1px; background: var(--line); margin: 5px 0; }
  .acct-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 9px; border-radius: 8px; border: none; background: transparent; cursor: pointer; color: var(--ink-2); font: 500 12.5px var(--sans); text-align: left; }
  .acct-item:hover { background: var(--bg-2); color: var(--ink); }

  /* link reset */
  a { color: inherit; text-decoration: none; }
  button { font: inherit; }

  /* svg icon stroke vars */
  .ic { width: 16px; height: 16px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .ic-sm { width: 14px; height: 14px; }
  .ic-lg { width: 18px; height: 18px; }

  /* placeholders for skeleton chart fill */
  defs, .defs-only { display: none; }

  /* ============ CLIENT PORTAL ============ */
  .portal-root {
    --p-bg: #0B0C0A; --p-surface: #121410; --p-surface-2: #171A14;
    --p-line: #232619; --p-line-2: #2E3222;
    --p-ink: #F4F5EE; --p-ink-2: #C5C9BB; --p-mute: #8A8E80; --p-mute-2: #5E6256;
    position: fixed; inset: 0; z-index: 200; overflow-y: auto;
    background:
      radial-gradient(1100px 500px at 80% -120px, color-mix(in srgb, var(--p-accent) 12%, transparent), transparent 70%),
      var(--p-bg);
    color: var(--p-ink); font-family: var(--sans);
  }
  .portal-preview-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 18px; background: color-mix(in srgb, var(--p-accent) 16%, #0b0c0a);
    border-bottom: 1px solid var(--p-line-2); font-size: 12px; color: var(--p-ink-2);
  }
  .portal-exit { display: inline-flex; align-items: center; gap: 5px; background: #0000003a; border: 1px solid var(--p-line-2); color: var(--p-ink-2); height: 26px; padding: 0 11px; border-radius: 999px; cursor: pointer; font: 500 11.5px var(--sans); }
  .portal-exit:hover { color: var(--p-ink); }

  .portal-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 32px; border-bottom: 1px solid var(--p-line);
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--p-bg) 88%, transparent); backdrop-filter: blur(14px);
  }
  .portal-logo { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; color: #0a0a0a; font: 700 18px var(--sans); }
  .portal-bizname { font: 600 16px var(--sans); letter-spacing: -0.01em; }
  .portal-dot { width: 6px; height: 6px; border-radius: 99px; background: #3FE0A8; display: inline-block; box-shadow: 0 0 8px #3FE0A8; }
  .portal-powered { font-size: 11.5px; color: var(--p-mute); }
  .portal-powered b { color: var(--p-ink-2); font-weight: 600; }
  .portal-avatar { width: 34px; height: 34px; border-radius: 99px; display: grid; place-items: center; background: var(--p-surface-2); border: 1px solid var(--p-line-2); color: var(--p-ink-2); font: 600 13px var(--sans); }

  .portal-body { max-width: 1100px; margin: 0 auto; padding: 40px 32px 60px; display: flex; flex-direction: column; gap: 26px; }

  .portal-hero { background: linear-gradient(135deg, color-mix(in srgb, var(--p-accent) 14%, var(--p-surface)), var(--p-surface) 62%); border: 1px solid color-mix(in srgb, var(--p-accent) 24%, var(--p-line-2)); border-radius: 20px; padding: 28px 30px; }
  .portal-eyebrow { font-size: 12px; color: var(--p-mute); text-transform: uppercase; letter-spacing: 0.14em; font-weight: 600; }
  .portal-h1 { font: 600 40px var(--sans); letter-spacing: -0.03em; margin: 8px 0 0; }
  .portal-lede { font-size: 16px; line-height: 1.6; color: var(--p-ink-2); max-width: 640px; margin: 12px 0 0; }

  .portal-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
  .portal-kpi { background: var(--p-surface); border: 1px solid var(--p-line); border-radius: 16px; padding: 18px; }
  .portal-kpi-ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--p-surface-2); border: 1px solid var(--p-line-2); color: var(--p-accent); }
  .portal-delta { display: inline-flex; align-items: center; gap: 3px; font: 600 12px var(--mono); }
  .portal-kpi-val { font: 700 30px var(--sans); letter-spacing: -0.03em; color: #fff; }
  .portal-kpi-label { font-size: 12.5px; color: var(--p-mute); margin-top: 3px; }
  .portal-kpi-sub { font-size: 11px; color: var(--p-mute-2); margin-top: 4px; }

  .portal-grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; }
  @media (max-width: 820px) { .portal-grid-2 { grid-template-columns: 1fr; } }

  .portal-card { background: var(--p-surface); border: 1px solid var(--p-line); border-radius: 18px; padding: 22px; }
  .portal-card-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; gap: 12px; }
  .portal-card-title { font: 600 16px var(--sans); letter-spacing: -0.01em; }
  .portal-card-sub { font-size: 12.5px; color: var(--p-mute); }
  .portal-trend-chip, .portal-live-chip { display: inline-flex; align-items: center; gap: 5px; font: 600 11.5px var(--sans); padding: 4px 10px; border-radius: 999px; background: var(--p-surface-2); border: 1px solid var(--p-line-2); flex-shrink: 0; }
  .portal-live-chip { color: var(--p-ink-2); }
  .portal-bar { height: 8px; border-radius: 99px; background: var(--p-surface-2); overflow: hidden; }
  .portal-bar > i { display: block; height: 100%; border-radius: 99px; transition: width .8s cubic-bezier(.22,.61,.36,1); }

  /* work section */
  .portal-work-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  @media (max-width: 820px) { .portal-work-grid { grid-template-columns: 1fr; gap: 20px; } }
  .portal-work-label { display: inline-flex; align-items: center; gap: 6px; font: 600 11.5px var(--sans); text-transform: uppercase; letter-spacing: 0.1em; color: var(--p-mute); }
  .portal-work-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 13px; border-radius: 12px; background: var(--p-surface-2); border: 1px solid var(--p-line); }
  .portal-work-wip { background: color-mix(in srgb, var(--p-accent) 7%, var(--p-surface-2)); }
  .portal-work-ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex-shrink: 0; background: var(--p-surface); border: 1px solid var(--p-line-2); color: var(--p-ink-2); }
  .portal-work-done { background: #3FE0A81a; border-color: #3FE0A844; color: #3FE0A8; }
  .portal-work-t { font: 600 13px var(--sans); color: var(--p-ink); }
  .portal-work-d { font-size: 12px; color: var(--p-mute); line-height: 1.45; }
  .portal-work-when { font-size: 10.5px; color: var(--p-mute-2); flex-shrink: 0; }

  /* reviews */
  .portal-rating { display: inline-flex; align-items: center; gap: 5px; font: 700 15px var(--sans); color: #FFB547; }
  .portal-review { padding: 13px 15px; border-radius: 12px; background: var(--p-surface-2); border: 1px solid var(--p-line); }
  .portal-review-n { font: 600 12.5px var(--sans); color: var(--p-ink-2); }
  .portal-stars { color: #FFB547; font-size: 12px; letter-spacing: 1px; }
  .portal-review-t { font-size: 13px; line-height: 1.5; color: var(--p-ink); margin: 0 0 6px; }
  .portal-review-d { font-size: 10.5px; color: var(--p-mute-2); }

  /* goals */
  .portal-goal-label { font: 600 13px var(--sans); }
  .portal-goal-val { font-size: 12px; color: var(--p-ink-2); }

  /* team */
  .portal-team { background: linear-gradient(120deg, color-mix(in srgb, var(--p-accent) 12%, var(--p-surface)), var(--p-surface) 60%); border: 1px solid var(--p-line-2); border-radius: 18px; padding: 22px 24px; }
  .portal-team-av { width: 48px; height: 48px; border-radius: 13px; display: grid; place-items: center; color: #0a0a0a; font: 700 20px var(--sans); }
  .portal-team-name { font: 600 15px var(--sans); }
  .portal-team-sub { font-size: 12.5px; color: var(--p-mute); }
  .portal-btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 15px; border-radius: 10px; border: none; cursor: pointer; color: #0a0a0a; font: 600 13px var(--sans); }
  .portal-btn-ghost { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 15px; border-radius: 10px; border: 1px solid var(--p-line-2); background: var(--p-surface-2); color: var(--p-ink-2); cursor: pointer; font: 600 13px var(--sans); }
  .portal-btn-ghost:hover { color: var(--p-ink); }

  .portal-empty { font-size: 13px; color: var(--p-mute); padding: 20px 0; text-align: center; line-height: 1.5; }
  .portal-foot { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding-top: 20px; border-top: 1px solid var(--p-line); font-size: 11.5px; color: var(--p-mute-2); }

  /* clickable KPI cards */
  .portal-kpi-btn { text-align: left; cursor: pointer; font: inherit; position: relative; transition: border-color .18s, transform .18s, background .18s; display: block; width: 100%; }
  .portal-kpi-btn:hover { border-color: color-mix(in srgb, var(--p-accent) 45%, var(--p-line)); transform: translateY(-2px); background: var(--p-surface-2); }

  .acv-log { position: absolute; right: 16px; bottom: 16px; width: 280px; max-height: 50%; overflow-y: auto; background: var(--elev); border: 1px solid var(--line-2); border-radius: 14px; padding: 14px; box-shadow: 0 16px 50px #000a; }
  .acv-log-row { padding: 5px 0; animation: optRecIn .3s ease both; }
  .acv-cfg { position: absolute; top: 0; right: 0; bottom: 0; width: 340px; background: var(--elev); border-left: 1px solid var(--line-2); display: flex; flex-direction: column; box-shadow: -20px 0 60px #0009; z-index: 5; }
  .acv-lbl { font-size: 11px; color: var(--ink-2); font-weight: 500; }
  .acv-input { width: 100%; background: var(--bg-2); border: 1px solid var(--line); border-radius: 9px; color: var(--ink); font: 400 12.5px var(--sans); padding: 9px 11px; outline: none; box-sizing: border-box; }
  .acv-input:focus { border-color: #cfff3a66; }
  .acv-cfg-status { border: 1px solid; border-radius: 10px; padding: 10px 12px; background: var(--bg-1); }
  .acv-overlay { position: fixed; inset: 0; z-index: 230; background: #04050588; backdrop-filter: blur(6px); display: grid; place-items: center; }
  .acv-palette { width: 480px; max-width: 92vw; background: var(--elev); border: 1px solid var(--line-2); border-radius: 16px; padding: 18px; box-shadow: 0 30px 90px #000c; }
  .acv-pal-item { display: flex; gap: 10px; align-items: center; padding: 11px 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg-2); cursor: pointer; text-align: left; }
  .acv-pal-item:hover { border-color: var(--line-3); }

  .acv-node.born { animation: nodeBorn .5s cubic-bezier(.22,1.2,.36,1) both; }

  .acv-conn { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 11px; border-radius: 10px; background: var(--bg-1); border: 1px solid var(--line); }

  .acv-aibtn:hover { color: #cfc4ff; }
  .acv-secnav { display: flex; gap: 4px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 4px; }

  .nodeai-orb { width: 28px; height: 28px; border-radius: 8px; background: var(--lime); color: #0a0a0a; display: grid; place-items: center; flex-shrink: 0; box-shadow: 0 0 14px #cfff3a55; }
  .nodeai-input { flex: 1; min-width: 0; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 9px; color: var(--ink); font: 400 12.5px var(--sans); padding: 9px 11px; outline: none; }
  .nodeai-input:focus { border-color: #cfff3a66; }
  .nodeai-go { width: 34px; height: 34px; border-radius: 9px; border: none; background: var(--lime); color: #0a0a0a; cursor: pointer; display: grid; place-items: center; flex-shrink: 0; }
  .nodeai-ex { font: 500 10.5px var(--sans); color: var(--ink-2); background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 9px; cursor: pointer; }
  .nodeai-ex:hover { border-color: var(--lime); color: #fff; }
  .acv-rec { margin-top: 2px; padding: 12px 13px; border-radius: 11px; background: #8b7cff10; border: 1px solid #8b7cff2e; }
  .acv-recbtn { display: flex; align-items: center; gap: 7px; width: 100%; justify-content: center; background: transparent; border: none; cursor: pointer; color: #b4a8ff; font: 600 12px var(--sans); }
  .acv-recbtn:hover { color: #cfc4ff; }
  .acv-rec-row { display: flex; gap: 7px; align-items: flex-start; font-size: 11.5px; color: var(--ink-2); line-height: 1.45; }
  .acv-rec-tag { flex-shrink: 0; font: 700 8.5px var(--sans); letter-spacing: .08em; padding: 2px 6px; border-radius: 5px; background: var(--bg-3); color: var(--mute); text-transform: uppercase; }
  .acv-rec-tag.lime { background: #cfff3a22; color: var(--lime); }
  .acv-desc { border-top: 1px solid var(--line); padding: 12px 16px; background: var(--bg-1); }
  .acv-desc-head { display: flex; align-items: center; justify-content: space-between; width: 100%; background: none; border: none; cursor: pointer; padding: 0; }
  .acv-desc-text { font-size: 12.5px; color: var(--ink-2); line-height: 1.55; margin: 8px 0 0; }
  .tw-bulk { position: sticky; bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-radius: 14px; background: var(--elev); border: 1px solid var(--lime); box-shadow: 0 16px 50px #000a; z-index: 5; }
